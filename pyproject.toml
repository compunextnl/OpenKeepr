[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "app/translations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C90"]
ignore = ["S101"]  # asserts in tests are fine

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
