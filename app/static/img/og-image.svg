<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f6ff"/>
      <stop offset="100%" stop-color="#fdfbf8"/>
    </linearGradient>
    <radialGradient id="aurora1" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#c7c9ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c7c9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="0.85" cy="0.1" r="0.45">
      <stop offset="0%" stop-color="#ffd2ec" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd2ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="0.75" cy="0.95" r="0.55">
      <stop offset="0%" stop-color="#b9f0ea" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#b9f0ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6a6bff"/>
      <stop offset="60%"  stop-color="#9d6bff"/>
      <stop offset="100%" stop-color="#ff7bcd"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1024"/>
      <stop offset="100%" stop-color="#383b54"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0e1024" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#aurora1)"/>
  <rect width="1200" height="630" fill="url(#aurora2)"/>
  <rect width="1200" height="630" fill="url(#aurora3)"/>

  <!-- Brand mark -->
  <g transform="translate(96, 96)">
    <rect width="84" height="84" rx="22" fill="url(#brand)"/>
    <rect x="14" y="14" width="56" height="56" rx="14"
          fill="url(#bg)" opacity=".7"/>
    <path d="M28 44 l12 12 24 -28"
          fill="none" stroke="url(#brand)" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="200" y="155" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="38" font-weight="600" fill="#0e1024" letter-spacing="-1">OpenKeepr</text>

  <!-- Headline -->
  <text x="96" y="340" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="92" font-weight="700" fill="url(#ink)" letter-spacing="-3">
    Share securely.
  </text>
  <text x="96" y="440" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="92" font-weight="700" fill="url(#brand)" letter-spacing="-3">
    Once. Encrypted.
  </text>

  <!-- Tagline -->
  <text x="96" y="510" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif"
        font-size="28" fill="#383b54" font-weight="400">
    End-to-end encrypted in your browser. Zero-knowledge.
  </text>

  <!-- Pill -->
  <g transform="translate(96, 552)">
    <rect width="280" height="44" rx="22" fill="#ffffff" opacity=".75" stroke="rgba(14,16,36,.10)"/>
    <circle cx="22" cy="22" r="4.5" fill="#10b981"/>
    <text x="38" y="29" font-family="-apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#383b54" letter-spacing="0.5">
      AES-256-GCM · BROWSER-SIDE
    </text>
  </g>
</svg>
