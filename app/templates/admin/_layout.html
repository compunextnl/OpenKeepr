{% extends "base.html" %}
{% block content %}
<div class="row">
  <aside class="col-12 col-md-3 col-lg-2 mb-3">
    <div class="list-group list-group-flush">
      <a href="{{ url_for('admin.dashboard') }}"     class="list-group-item list-group-item-action {% if request.endpoint=='admin.dashboard' %}active{% endif %}"><i class="bi bi-speedometer2"></i> {{ _('Overview') }}</a>
      <a href="{{ url_for('admin.audit_log') }}"     class="list-group-item list-group-item-action {% if request.endpoint=='admin.audit_log' %}active{% endif %}"><i class="bi bi-journal-text"></i> {{ _('Audit log') }}</a>
      <a href="{{ url_for('admin.feedback_list') }}" class="list-group-item list-group-item-action {% if 'feedback' in request.endpoint %}active{% endif %}"><i class="bi bi-chat-left-text"></i> {{ _('Feedback') }}</a>
      <a href="{{ url_for('admin.users') }}"         class="list-group-item list-group-item-action {% if request.endpoint=='admin.users' %}active{% endif %}"><i class="bi bi-people"></i> {{ _('Users') }}</a>
      <a href="{{ url_for('admin.api_keys') }}"      class="list-group-item list-group-item-action {% if request.endpoint=='admin.api_keys' %}active{% endif %}"><i class="bi bi-key"></i> {{ _('API keys') }}</a>
      <a href="{{ url_for('admin.email_test') }}"    class="list-group-item list-group-item-action {% if request.endpoint=='admin.email_test' %}active{% endif %}"><i class="bi bi-envelope-check"></i> {{ _('E-mail test') }}</a>
      <a href="{{ url_for('admin.settings') }}"      class="list-group-item list-group-item-action {% if request.endpoint=='admin.settings' %}active{% endif %}"><i class="bi bi-gear"></i> {{ _('Settings') }}</a>
    </div>
  </aside>
  <section class="col-12 col-md-9 col-lg-10">
    {% block admin_content %}{% endblock %}
  </section>
</div>
{% endblock %}
