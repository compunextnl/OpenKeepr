{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-12 col-md-8">
    <i class="bi bi-cone-striped display-1 text-warning"></i>
    <h1 class="h3 mt-3">{{ _('%(name)s is in maintenance mode', name=app_name) }}</h1>
    <p class="text-body-secondary">{{ settings.maintenance_message or _('We’ll be back shortly. Please try again in a few minutes.') }}</p>
  </div>
</div>
{% endblock %}
