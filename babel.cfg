# Standard Flask-Babel mapping. Patterns are evaluated relative to the
# *input directory* passed to pybabel extract — we pass the project root
# from app/services/translations.py, hence the `app/...` prefix.
#
# The `jinja2.ext.babel_extract` callable is referenced as a dotted Python
# path so Babel imports it directly. This avoids relying on the `jinja2`
# entry point (Jinja2 3.x no longer registers it by default).
#
# `autoescape` and `with_` are core in Jinja2 3.x, so no `extensions=` line
# is needed any more.
[python: app/**.py]
[jinja2.ext.babel_extract: app/templates/**.html]
